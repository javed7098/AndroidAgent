name: Build Spider AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SpiderAI/**'
      - '.github/workflows/spider-ai.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: SpiderAI
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPIDER-AI-APK
          path: SpiderAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
